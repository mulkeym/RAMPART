[project]
name = "rampart"
version = "0.1.0"
description = "Request And Model Prompt Analysis & Routing Tool"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.100",
  "httpx>=0.27",
  "itsdangerous>=2.0",
  "pydantic>=2",
  "pyyaml>=6",
  "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
