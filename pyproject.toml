[project]
name = "rampart"
version = "0.1.0"
description = "Request And Model Prompt Analysis & Routing Tool"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.100",
  "httpx>=0.27",
  "itsdangerous>=2.0",
  "pydantic>=2",
  "pyyaml>=6",
  "uvicorn>=0.23",
  # Transitive dependency pins for CVE remediation
  "h11>=0.16.0",           # CVE-2025-43859 (critical) - HTTP request smuggling
  "certifi>=2024.7.4",     # CVE-2024-39689 (high) - untrusted root certs
  "idna>=3.15",            # CVE-2024-3651, CVE-2024-12224 (high) - DoS + punycode
  "starlette>=1.0.1",      # CVE-2026-48710 (medium) - host header injection
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
